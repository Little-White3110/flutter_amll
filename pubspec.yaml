name: flutter_amll
description: Apple Music 风格（AMLL）逐字歌词渲染组件库，自 md3music 抽取。
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # 偏好面板使用 M3ESlider；预览页使用 showM3EModalBottomSheet
  m3e_core: ^1.1.4
  # material_ui 1.3.0 实际要求 Flutter >= 3.47（用了 @awaitNotRequired）
  material_ui: ^1.3.0
  # 歌词偏好持久化
  shared_preferences: ^2.5.0
  # TTML（Apple Music XML 歌词）解析
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
